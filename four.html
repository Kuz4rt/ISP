<body>
    <div class="tasks">
        <div class="container">
            <label id="input1">Даны целые числа K, N и набор из N целых чисел. Если в наборе имеются числа, меньшие K,
                то вывести TRUE; в противном случае вывести FALSE.</label>
            <form>
                <label>Введите N:</label>
                <input id="Number_N" type="text">

                <label>Введите K:</label>
                <input id="Number_K" type="text">
            </form>
            <div class="task_result" id="N_K_result"></div>
            <button onclick="N_K()">Ввод</button>
        </div>

        <div class="container">
            <label id="input2">Дано целое число N (> 0). Найти сумму 1 + 1/2 + 1/3 + . . . + 1/N (вещественное
                число).</label>
            <form>
                <label>Введите число:</label>
                <input id="Number_N_2" type="text">
            </form>
            <button onclick="N_sequence()">Ввод</button>
            <div class="task_result" id="N_sequence_result"></div>
        </div>
    </div>
</body>
